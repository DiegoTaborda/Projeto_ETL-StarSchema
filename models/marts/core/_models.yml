version: 2

models:
  - name: dim_date
    description: "Dimensão data gerada de 2016-01-01 a 2019-12-31."
    columns:
      - name: date_day
        tests: [unique, not_null]

  - name: dim_customers
    description: "Dimensão cliente no grão da pessoa física (customer_unique_id)."
    columns:
      - name: customer_unique_id
        tests: [unique, not_null]

  - name: dim_products
    description: "Dimensão produto com categoria traduzida para inglês."
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: dim_sellers
    description: "Dimensão vendedor."
    columns:
      - name: seller_id
        tests: [unique, not_null]

  - name: fct_order_items
    description: "Fato no grão de item de pedido. Métricas: price, freight_value."
    columns:
      - name: order_item_sk
        description: "Surrogate key composta (order_id + order_item_id)."
        tests: [unique, not_null]
      - name: customer_unique_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_unique_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: seller_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_sellers')
              field: seller_id
      - name: date_day
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day